# Render "Blueprint": creates the Falcon Eye backend as a free web service.
# Secrets are NOT written here. Render asks you to type them in its dashboard.
services:
  - type: web
    name: falcon-eye-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DATABASE_URL        # Supabase "Session pooler" string. Typed in the dashboard.
        sync: false
      - key: CORS_ORIGINS        # e.g. https://falcon.projectfalcon.cc
        sync: false
      - key: APP_BASE_URL        # same address as above
        sync: false
